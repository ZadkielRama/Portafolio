<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTrivia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Fondo base -->
  <rect width="600" height="340" rx="12" fill="url(#bgTrivia)" stroke="#334155" stroke-width="1.5" />

  <!-- Cabecera de ventana -->
  <rect width="600" height="36" rx="12" fill="#111827" />
  <rect y="24" width="600" height="12" fill="#111827" />
  <line x1="0" y1="36" x2="600" y2="36" stroke="#1F2937" stroke-width="1" />
  
  <circle cx="20" cy="18" r="4.5" fill="#EF4444" />
  <circle cx="36" cy="18" r="4.5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="4.5" fill="#10B981" />
  <text x="300" y="22" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">triviabiblica.pwa // Real-Time SignalR Engine</text>

  <!-- Mockup Móvil PWA en el lado izquierdo -->
  <g transform="translate(40, 50)">
    <!-- Marco de teléfono -->
    <rect width="160" height="270" rx="18" fill="#020617" stroke="#475569" stroke-width="2" />
    <rect x="55" y="6" width="50" height="8" rx="4" fill="#1E293B" />
    
    <!-- Pantalla del juego -->
    <rect x="8" y="20" width="144" height="240" rx="12" fill="#0F172A" />
    
    <!-- Timer de ronda -->
    <circle cx="80" cy="50" r="18" fill="none" stroke="#334155" stroke-width="3" />
    <circle cx="80" cy="50" r="18" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="30" />
    <text x="80" y="55" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">08s</text>

    <!-- Tarjeta de pregunta activa -->
    <rect x="14" y="80" width="132" height="55" rx="6" fill="#1E293B" />
    <text x="20" y="96" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="8">PREGUNTA #07 / 10</text>
    <text x="20" y="112" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="9">¿Quién construyó el arca?</text>

    <!-- Opciones de respuesta -->
    <rect x="14" y="145" width="132" height="24" rx="4" fill="#00E599" />
    <text x="22" y="161" fill="#050505" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="9">A) Noé ✓ (Correcto)</text>

    <rect x="14" y="175" width="132" height="24" rx="4" fill="#1E293B" />
    <text x="22" y="191" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">B) Moisés</text>

    <rect x="14" y="205" width="132" height="24" rx="4" fill="#1E293B" />
    <text x="22" y="221" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">C) Abraham</text>

    <text x="80" y="248" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">● 42 JUGADORES EN VIVO</text>
  </g>

  <!-- Panel Derecho: Arquitectura de Baja Latencia & Ranking -->
  <g transform="translate(230, 50)">
    <!-- Métricas técnicas de WebSockets -->
    <rect width="330" height="90" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="16" y="24" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="10">INFRAESTRUCTURA REAL-TIME</text>
    
    <g transform="translate(16, 40)">
      <rect width="90" height="36" rx="4" fill="#0F172A" />
      <text x="8" y="16" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="8">LATENCIA SYNC</text>
      <text x="8" y="30" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="11">&lt; 18 ms</text>
    </g>

    <g transform="translate(118, 40)">
      <rect width="90" height="36" rx="4" fill="#0F172A" />
      <text x="8" y="16" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="8">CACHE REDIS</text>
      <text x="8" y="30" fill="#F8FAFC" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="11">Sub/Pub OK</text>
    </g>

    <g transform="translate(220, 40)">
      <rect width="94" height="36" rx="4" fill="#0F172A" />
      <text x="8" y="16" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="8">FRONTEND PWA</text>
      <text x="8" y="30" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="11">Blazor Web</text>
    </g>
  </g>

  <!-- Ranking y Tabla en vivo -->
  <g transform="translate(230, 155)">
    <rect width="330" height="165" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="16" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12">🏆 Tabla de Posiciones en Directo</text>
    <text x="240" y="24" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="10">SALA #4492</text>

    <!-- Fila 1 -->
    <rect x="14" y="36" width="302" height="32" rx="4" fill="#0F172A" />
    <text x="24" y="56" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="12">#1</text>
    <text x="50" y="56" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Ezequiel Ramirez</text>
    <text x="250" y="56" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="11">2,450 pts</text>

    <!-- Fila 2 -->
    <rect x="14" y="74" width="302" height="32" rx="4" fill="#0F172A" />
    <text x="24" y="94" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="12">#2</text>
    <text x="50" y="94" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Matias Gomez</text>
    <text x="250" y="94" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="11">2,120 pts</text>

    <!-- Fila 3 -->
    <rect x="14" y="112" width="302" height="32" rx="4" fill="#0F172A" />
    <text x="24" y="132" fill="#D97706" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="12">#3</text>
    <text x="50" y="132" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Sofia Benitez</text>
    <text x="250" y="132" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="11">1,980 pts</text>
  </g>
</svg>
