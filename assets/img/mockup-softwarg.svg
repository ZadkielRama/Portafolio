  </defs>

  <!-- Fondo de la tarjeta / ventana -->
  <rect width="600" height="340" rx="12" fill="url(#bgSoftwarg)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Barra superior del sistema (Window Header) -->
  <rect width="600" height="36" rx="12" fill="#111827" />
  <rect y="24" width="600" height="12" fill="#111827" />
  <line x1="0" y1="36" x2="600" y2="36" stroke="#1F2937" stroke-width="1" />
  
  <circle cx="20" cy="18" r="4.5" fill="#EF4444" />
  <circle cx="36" cy="18" r="4.5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="4.5" fill="#10B981" />
  
  <rect x="180" y="8" width="240" height="20" rx="4" fill="#1E293B" />
  <text x="300" y="22" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">softwarg.ar // AI &amp; Solutions Core</text>

  <!-- Barra lateral (Sidebar SoftwArg) -->
  <rect x="16" y="50" width="115" height="274" rx="8" fill="url(#cardGrad)" stroke="#1F2937" />
  <text x="30" y="78" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12">SoftwArg</text>
  <rect x="30" y="86" width="30" height="3" fill="#00E599" rx="1.5" />
  
  <!-- Items de menú lateral -->
  <rect x="24" y="104" width="99" height="24" rx="4" fill="rgba(0, 229, 153, 0.15)" stroke="#00E599" stroke-width="1" />
  <text x="34" y="120" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="10">● AI Pipelines</text>
  
  <rect x="24" y="136" width="99" height="22" rx="4" fill="#0F172A" />
  <text x="34" y="151" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="10">🤖 Agentes LLM</text>
  
  <rect x="24" y="166" width="99" height="22" rx="4" fill="#0F172A" />
  <text x="34" y="181" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="10">📅 Turnos Med</text>

  <rect x="24" y="196" width="99" height="22" rx="4" fill="#0F172A" />
  <text x="34" y="211" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="10">⚡ Cloud Server</text>

  <!-- Panel Central: Métricas rápidas (KPIs) -->
  <g transform="translate(145, 50)">
    <!-- KPI 1 -->
    <rect width="135" height="64" rx="8" fill="url(#cardGrad)" stroke="#1F2937" />
    <text x="14" y="24" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="10">AGENTES ACTIVOS</text>
    <text x="14" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="17">18 Nodos</text>
    <text x="96" y="48" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="10">LIVE</text>

    <!-- KPI 2 -->
    <rect x="148" width="135" height="64" rx="8" fill="url(#cardGrad)" stroke="#1F2937" />
    <text x="162" y="24" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="10">LATENCIA IA</text>
    <text x="162" y="48" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="17">240 ms</text>
    <text x="238" y="48" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="10">RAG</text>

    <!-- KPI 3 -->
    <rect x="296" width="143" height="64" rx="8" fill="url(#cardGrad)" stroke="#1F2937" />
    <text x="310" y="24" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="10">UPTIME MENSUAL</text>
    <text x="310" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="17">99.98%</text>
    <text x="388" y="48" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="10">SLA</text>
  </g>

  <!-- Panel Inferior: Diagrama de Orquestación & Consola de Agentes -->
  <g transform="translate(145, 126)">
