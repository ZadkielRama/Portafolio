    <!-- Nodo 1 -->
    <g transform="translate(18, 38)">
      <rect width="110" height="42" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="10" y="18" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="8">ENTRADA</text>
      <text x="10" y="32" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10">Docs &amp; Webhooks</text>
    </g>

    <!-- Conector 1 -->
    <line x1="130" y1="59" x2="152" y2="59" stroke="#00E599" stroke-width="1.5" stroke-dasharray="3 2" />
    <polygon points="152,56 157,59 152,62" fill="#00E599" />

    <!-- Nodo 2 Central (IA) -->
    <g transform="translate(160, 38)">
      <rect width="125" height="42" rx="6" fill="#0F172A" stroke="#00E599" stroke-width="1.5" />
      <text x="10" y="18" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="8">ORQUESTADOR LLM</text>
      <text x="10" y="32" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10">DeepSeek / GPT-4o</text>
    </g>

    <!-- Conector 2 -->
    <line x1="287" y1="59" x2="309" y2="59" stroke="#00E599" stroke-width="1.5" stroke-dasharray="3 2" />
    <polygon points="309,56 314,59 309,62" fill="#00E599" />

    <!-- Nodo 3 -->
    <g transform="translate(316, 38)">
      <rect width="105" height="42" rx="6" fill="#0F172A" stroke="#38BDF8" />
      <text x="10" y="18" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="8">ACCIÓN</text>
      <text x="10" y="32" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10">API / Turnos / CRM</text>
    </g>

    <!-- Consola de Ejecución en Vivo -->
    <g transform="translate(18, 92)">
      <rect width="403" height="92" rx="6" fill="#050505" stroke="#1F2937" />
      <text x="12" y="18" fill="#475569" font-family="'IBM Plex Mono', monospace" font-size="9">// SOFTWARG CORE ENGINE — WORKER #01</text>
      <text x="12" y="36" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="9.5">2026-11-13 23:00 [PIPELINE] Despachando tarea automatizada de integracion</text>
      <text x="12" y="52" fill="#F8FAFC" font-family="'IBM Plex Mono', monospace" font-size="9.5">2026-11-13 23:00 [AI_ROUTER] Modelo asignado: DeepSeek-V3 (latencia 180ms)</text>
      <text x="12" y="68" fill="#F8FAFC" font-family="'IBM Plex Mono', monospace" font-size="9.5">2026-11-13 23:00 [DATABASE] Sincronizando registros relacionales y cache Redis</text>
      <text x="12" y="83" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="9.5">&gt; EJECUCION EXITOSA. CERO INTERVENCION MANUAL REQUERIDA (200 OK)</text>
    </g>
  </g>
</svg>
