<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEnroque" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Fondo base -->
  <rect width="600" height="340" rx="12" fill="url(#bgEnroque)" stroke="#334155" stroke-width="1.5" />

  <!-- Cabecera de ventana estilo Enterprise ERP -->
  <rect width="600" height="36" rx="12" fill="#111827" />
  <rect y="24" width="600" height="12" fill="#111827" />
  <line x1="0" y1="36" x2="600" y2="36" stroke="#1F2937" stroke-width="1" />
  
  <circle cx="20" cy="18" r="4.5" fill="#EF4444" />
  <circle cx="36" cy="18" r="4.5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="4.5" fill="#10B981" />
  <text x="300" y="22" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">ENROQUE.SYS // Enterprise Billing &amp; Warehouse ERP</text>

  <!-- Panel Izquierdo: Factura Electrónica AFIP -->
  <g transform="translate(30, 50)">
    <rect width="250" height="265" rx="8" fill="#1E293B" stroke="#334155" />
    <rect x="12" y="12" width="226" height="30" rx="4" fill="#0F172A" />
    <text x="20" y="32" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="bold">COMPROBANTE ELECTRÓNICO</text>
    <text x="195" y="32" fill="#F8FAFC" font-family="'IBM Plex Mono', monospace" font-size="10">FC "A"</text>

    <text x="20" y="65" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="9">CLIENTE MAYORISTA:</text>
    <text x="20" y="80" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11">SUPERMERCADOS DEL VALLE S.A.</text>
    <text x="20" y="95" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="9">CUIT: 30-71234567-9</text>

    <line x1="16" y1="110" x2="234" y2="110" stroke="#334155" />

    <!-- Items de factura -->
    <text x="20" y="130" fill="#E2E8F0" font-family="'IBM Plex Mono', monospace" font-size="10">100x Queso Tybo (Barra)</text>
    <text x="180" y="130" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="10">$450.000</text>

    <text x="20" y="152" fill="#E2E8F0" font-family="'IBM Plex Mono', monospace" font-size="10">50x Queso Reggianito</text>
    <text x="180" y="152" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="10">$320.000</text>

    <text x="20" y="174" fill="#E2E8F0" font-family="'IBM Plex Mono', monospace" font-size="10">80x Queso Mozzarella</text>
    <text x="180" y="174" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="10">$280.000</text>

    <line x1="16" y1="192" x2="234" y2="192" stroke="#334155" />

    <text x="20" y="212" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">TOTAL NETO:</text>
    <text x="140" y="212" fill="#F8FAFC" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="13">$ 1,050,000</text>

    <!-- Badge AFIP CAE Aprobado -->
    <rect x="16" y="226" width="218" height="26" rx="4" fill="rgba(0, 229, 153, 0.12)" stroke="#00E599" stroke-width="1" />
    <text x="125" y="243" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle" font-weight="bold">✓ CAE AFIP: 74218939281893 (APROBADO)</text>
  </g>

  <!-- Panel Derecho: Motor de Actualización de Precios & Stock -->
  <g transform="translate(300, 50)">
    <rect width="270" height="125" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="16" y="24" fill="#F59E0B" font-family="'IBM Plex Mono', monospace" font-size="10">ACTUALIZACIÓN MASIVA DE PRECIOS</text>
    
    <rect x="14" y="38" width="242" height="34" rx="4" fill="#0F172A" />
    <text x="24" y="58" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Fórmula: +12.5% Inflación / Costos</text>
    <text x="215" y="58" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="10">EXEC</text>

    <text x="16" y="92" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="9">Impacto instantáneo en 1.400 artículos</text>
    <rect x="16" y="102" width="238" height="6" rx="3" fill="#0F172A" />
    <rect x="16" y="102" width="238" height="6" rx="3" fill="#00E599" />
  </g>

  <g transform="translate(300, 190)">
    <rect width="270" height="125" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="16" y="24" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="10">CONTROL DE CUENTAS CORRIENTES</text>

    <g transform="translate(14, 38)">
      <rect width="115" height="42" rx="4" fill="#0F172A" />
      <text x="8" y="16" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="8">SALDO COBRABLE</text>
      <text x="8" y="32" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="11">$ 14.8M</text>
    </g>

    <g transform="translate(138, 38)">
      <rect width="118" height="42" rx="4" fill="#0F172A" />
      <text x="8" y="16" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="8">REMITOS PENDIENTES</text>
      <text x="8" y="32" fill="#F8FAFC" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="11">0</text>
    </g>

    <text x="16" y="104" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="9">Base de datos transaccional SQL Server</text>
  </g>
</svg>
