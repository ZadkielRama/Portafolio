<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo base -->
  <rect width="200" height="200" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Rejilla técnica -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="100" cy="100" r="68" fill="url(#glow)" />
  
  <!-- Aura y silueta tech de Arquitecto -->
  <!-- Hombros y torso -->
  <path d="M 40 185 C 40 145 65 130 100 130 C 135 130 160 145 160 185" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <!-- Cuello -->
  <path d="M 85 132 L 85 110 L 115 110 L 115 132 Z" fill="#334155" />
  <!-- Cabeza / Rostro geométrico moderno -->
  <rect x="74" y="55" width="52" height="60" rx="14" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2.5" />
  
  <!-- Visor / Interfaz HUD cibernética -->
  <rect x="79" y="70" width="42" height="15" rx="4" fill="#020617" stroke="#00E599" stroke-width="1.5" />
  <line x1="83" y1="77" x2="117" y2="77" stroke="#00E599" stroke-width="2" stroke-linecap="round" />
  
  <!-- Nodos de red / IA flotantes -->
  <circle cx="48" cy="65" r="4" fill="#00E599" />
  <line x1="48" y1="65" x2="74" y2="80" stroke="#00E599" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  
  <circle cx="152" cy="75" r="4" fill="#00E599" />
  <line x1="152" y1="75" x2="126" y2="80" stroke="#00E599" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  
  <circle cx="100" cy="30" r="4" fill="#00E599" />
  <line x1="100" y1="30" x2="100" y2="55" stroke="#00E599" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Insignia técnica inferior -->
  <rect x="62" y="166" width="76" height="20" rx="4" fill="#0F172A" stroke="#00E599" stroke-width="1" />
  <text x="100" y="180" fill="#00E599" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">ARCHITECT</text>
</svg>
